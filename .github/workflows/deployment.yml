name: Deployment acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ESA_GO_ARCH: amd64
      # build_esa.sh runs the tests, which need Postgres; this ephemeral test
      # database is not a deployment secret.
      ESA_TEST_DATABASE_URL: postgres://esa:esa-ci@localhost:5432/esa_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: esa
          POSTGRES_PASSWORD: esa-ci
          POSTGRES_DB: esa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esa -d esa_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build existing service and run deterministic tests
        run: sh scripts/build_esa.sh
      - name: Verify isolated Redmine deployment without real Agents
        run: python3 -B scripts/verify_deployment.py --output .tools/deployment-checks
      - name: Save sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/deployment-checks/artifacts/
          include-hidden-files: true
          retention-days: 7
